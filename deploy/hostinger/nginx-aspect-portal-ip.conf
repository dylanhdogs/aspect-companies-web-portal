server {
    listen 80;
    server_name __VPS_PUBLIC_IPV4__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __VPS_PUBLIC_IPV4__;

    ssl_certificate /etc/letsencrypt/live/__VPS_PUBLIC_IPV4__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__VPS_PUBLIC_IPV4__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 16m;
    access_log /var/log/nginx/aspect-portal.access.log;
    error_log /var/log/nginx/aspect-portal.error.log;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
